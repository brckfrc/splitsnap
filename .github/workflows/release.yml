# One-button iOS release: Actions → Release → Run workflow (on main).
#
#   CI checks → reset staging ┐
#             → e2e build    ─┴→ Maestro on staging → production build + TestFlight
#
# Each step needs the previous ones green. Builds and the App Store upload run
# on EAS; the Maestro run uses a GitHub macOS runner (free for this public repo)
# against the hosted staging Supabase project, never production.
# A successful production run tags the commit (v<version>-build.<n>).
# Builds are reused when no app file changed since the last one
# (scripts/reusable-eas-build.sh): the Free plan has 15 iOS builds a month.
# What stays manual: the TestFlight check on the phone and "Add for Review".
# Details: docs/APP-STORE.md → Release.
name: Release

on:
  workflow_dispatch:
    inputs:
      production_build:
        description: "Build for production and upload to TestFlight (off = test only)"
        type: boolean
        default: true
      new_builds:
        description: "Build again even if no app file changed (e.g. after changing EAS environment variables)"
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  EAS_CLI_VERSION: 27.11.0
  MAESTRO_VERSION: 2.12.1

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  # Lists what changed since the last release tag in the run summary, as the
  # checklist for docs/RELEASE_NOTES.md.
  changes:
    name: Changes since the last release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: |
          last="$(git tag --list 'v*-build.*' --sort=-creatordate | head -1)"
          {
            echo "## Changes since ${last:-the first commit (no release tag yet)}"
            echo
            git log --no-merges --format='- %h %s' ${last:+"$last"..}HEAD | head -200
          } >> "$GITHUB_STEP_SUMMARY"

  staging:
    name: Reset staging database
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v3
        with:
          version: 3.4.0
      - run: ./scripts/staging-reset.sh
        env:
          STAGING_PROJECT_REF: ${{ vars.STAGING_PROJECT_REF }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.STAGING_DB_PASSWORD }}
          STAGING_TEST_PASSWORD: ${{ secrets.STAGING_TEST_PASSWORD }}

  e2e_build:
    name: EAS simulator build (staging)
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      artifact_url: ${{ steps.reuse.outputs.reuse == 'true' && steps.reuse.outputs.url || steps.build.outputs.artifact_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the reuse check diffs against the last build's commit
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: expo/expo-github-action@v9
        with:
          eas-version: ${{ env.EAS_CLI_VERSION }}
          packager: npm
          token: ${{ secrets.EXPO_TOKEN }}
      - id: reuse
        run: |
          scripts/reusable-eas-build.sh e2e | tee reuse.txt
          echo "**e2e build:** $(grep '^reason=' reuse.txt | cut -d= -f2-)" >> "$GITHUB_STEP_SUMMARY"
        env:
          FORCE_NEW_BUILD: ${{ inputs.new_builds }}
      - if: steps.reuse.outputs.reuse != 'true'
        run: npm ci
      # The e2e profile builds an unsigned simulator .app against the EAS
      # `preview` environment, which holds staging's URL and key.
      - id: build
        if: steps.reuse.outputs.reuse != 'true'
        run: |
          eas build --platform ios --profile e2e --non-interactive --wait --json > build.json
          echo "artifact_url=$(jq -r '.[0].artifacts.buildUrl' build.json)" >> "$GITHUB_OUTPUT"

  maestro:
    name: Maestro smoke flow
    needs: [staging, e2e_build]
    # The default macOS images only ship iOS 26 simulators; the app targets
    # iOS 27, so use GitHub's Xcode 27 image (preview label, actions/runner-images#14404).
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Boot a simulator and install the e2e build
        run: |
          xcrun simctl list runtimes
          # An iPhone on the newest installed iOS runtime.
          runtime="$(xcrun simctl list runtimes available -j | jq -r '[.runtimes[] | select(.platform == "iOS")] | sort_by(.version | split(".") | map(tonumber)) | last | .identifier')"
          udid="$(xcrun simctl list devices available -j | jq -r --arg r "$runtime" '[.devices[$r][] | select(.name | test("^iPhone"))] | last | .udid')"
          echo "Using $udid on $runtime"
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid"
          curl -fsSL "${{ needs.e2e_build.outputs.artifact_url }}" -o app.tar.gz
          mkdir app && tar -xzf app.tar.gz -C app
          xcrun simctl install "$udid" "$(find app -maxdepth 2 -name '*.app' | head -1)"
      - name: Run the smoke flow
        run: |
          maestro test \
            -e APP_TARGET=release \
            -e SMOKE_EMAIL=deniz@borak.dev \
            -e SMOKE_PASSWORD="$SMOKE_PASSWORD" \
            --format junit --output maestro-report.xml \
            --debug-output maestro-debug \
            .maestro/smoke.yaml
        env:
          SMOKE_PASSWORD: ${{ secrets.STAGING_TEST_PASSWORD }}
          MAESTRO_CLI_NO_ANALYTICS: "1"
          MAESTRO_CLI_ANALYSIS_NOTIFICATION_DISABLED: "true"
      # On a failure, capture what the simulator shows at that moment as text: the
      # view hierarchy (every label and field value) and the app's log.
      # Screenshots cannot be redacted, and on 2026-11-22 one showed the staging
      # password typed into the e-mail field (artifact deleted, secret rotated).
      # This is a public repository, so the only image is the guarded one below.
      - name: Capture the simulator state
        if: failure()
        run: |
          mkdir -p maestro-debug/capture
          maestro hierarchy > maestro-debug/capture/hierarchy.json 2>&1 || true
          xcrun simctl spawn booted log show --last 10m --style compact \
            --predicate 'process == "SplitSnap" OR subsystem CONTAINS "splitsnap"' \
            > maestro-debug/capture/app.log 2>&1 || true
          # Maestro keeps its per-run logs and screenshots under ~/.maestro/tests.
          cp -R "$HOME/.maestro/tests" maestro-debug/maestro-tests 2>/dev/null || true
          # One screenshot of the failing screen, only once the sign-in subflow
          # has completed: the leak on 2026-11-22 was the password on the login
          # screen, which a signed-in screen no longer shows. As a second guard,
          # skip it if the live hierarchy still contains the password anywhere.
          # It goes outside maestro-debug, whose images are all deleted below.
          if grep -rqF "Run subflows/login.yaml COMPLETED" "$HOME/.maestro/tests" maestro-debug 2>/dev/null \
             && ! grep -qF -- "$SMOKE_PASSWORD" maestro-debug/capture/hierarchy.json; then
            mkdir -p post-login-screen
            xcrun simctl io booted screenshot post-login-screen/screen.png || true
          else
            echo "No screenshot: sign-in did not complete, or the password is on screen."
          fi
        env:
          SMOKE_PASSWORD: ${{ secrets.STAGING_TEST_PASSWORD }}
      # This is a public repository, so artifacts are readable by anyone. Text
      # (logs, hierarchies) can hold the staging password, e.g. a field value:
      # mask it in every text file, and drop every image, since an image of a
      # field cannot be masked.
      - name: Redact the test password
        if: always()
        run: |
          [ -d maestro-debug ] || exit 0
          find maestro-debug -type f \( -iname '*.png' -o -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.mp4' -o -iname '*.mov' \) -delete
          grep -rlIF -- "$SMOKE_PASSWORD" maestro-debug maestro-report.xml 2>/dev/null \
            | while IFS= read -r f; do
                SMOKE_PASSWORD="$SMOKE_PASSWORD" perl -pi -e 's/\Q$ENV{SMOKE_PASSWORD}\E/***/g' "$f"
              done
          if grep -rqIF -- "$SMOKE_PASSWORD" maestro-debug maestro-report.xml 2>/dev/null; then
            echo "password still present after redaction; not uploading debug output" >&2
            rm -rf maestro-debug
          fi
        env:
          SMOKE_PASSWORD: ${{ secrets.STAGING_TEST_PASSWORD }}
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: maestro-results
          path: |
            maestro-report.xml
            maestro-debug
            post-login-screen
            !maestro-debug/**/*.png
            !maestro-debug/**/*.jpg
            !maestro-debug/**/*.jpeg
            !maestro-debug/**/*.mp4
            !maestro-debug/**/*.mov
          if-no-files-found: ignore
          # ~/.maestro/tests is copied in as a plain folder, but Maestro may also
          # write dot-folders inside --debug-output; without this they are dropped.
          include-hidden-files: true
          retention-days: 7

  production:
    name: EAS production build → TestFlight
    needs: maestro
    if: inputs.production_build && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write # the release tag
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the reuse check needs the history and the release tags
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: expo/expo-github-action@v9
        with:
          eas-version: ${{ env.EAS_CLI_VERSION }}
          packager: npm
          token: ${{ secrets.EXPO_TOKEN }}
      # A production build that never reached App Store Connect (e.g. the
      # upload failed on 2026-11-23 over an unsigned Apple agreement) is
      # uploaded as it is, without a new build.
      - id: reuse
        run: |
          scripts/reusable-eas-build.sh production | tee reuse.txt
          echo "**production build:** $(grep '^reason=' reuse.txt | cut -d= -f2-)" >> "$GITHUB_STEP_SUMMARY"
        env:
          FORCE_NEW_BUILD: ${{ inputs.new_builds }}
      - if: steps.reuse.outputs.reuse != 'true'
        run: npm ci
      # autoIncrement assigns the build number; app.json's version must be a
      # train App Store Connect still accepts (see docs/APP-STORE.md).
      - id: build
        if: steps.reuse.outputs.reuse != 'true'
        run: |
          eas build --platform ios --profile production --non-interactive --wait --json > build.json
          {
            echo "id=$(jq -r '.[0].id' build.json)"
            echo "version=$(jq -r '.[0].appVersion' build.json)"
            echo "build_number=$(jq -r '.[0].appBuildVersion' build.json)"
          } >> "$GITHUB_OUTPUT"
      # Upload separately from the build, so a failed upload leaves a build the
      # next run picks up instead of building again.
      - name: Upload to App Store Connect / TestFlight
        run: eas submit --platform ios --profile production --id "$BUILD_ID" --non-interactive
        env:
          BUILD_ID: ${{ steps.reuse.outputs.id || steps.build.outputs.id }}
      # Marks the exact commit each App Store build came from, e.g. v1.2.1-build.17.
      - name: Tag the release commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "iOS $TAG (EAS production build, uploaded to TestFlight)" "$COMMIT"
          git push origin "$TAG"
        env:
          TAG: v${{ steps.reuse.outputs.version || steps.build.outputs.version }}-build.${{ steps.reuse.outputs.build_number || steps.build.outputs.build_number }}
          COMMIT: ${{ steps.reuse.outputs.commit || github.sha }}
