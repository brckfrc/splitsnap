# Signs in on the login screen. The credentials come from the environment
# (`-e SMOKE_EMAIL=… -e SMOKE_PASSWORD=…`), never from the repo.
appId: dev.borak.splitsnap
---
- tapOn:
    id: "login-email"
- inputText: ${SMOKE_EMAIL}
# Dismiss the keyboard before moving to the password field. On iOS 27.2 (CI,
# 2026-11-22) a tap on the password field right after typing left the focus in
# the e-mail field, so the password was appended to the e-mail and the form
# answered "Şifre gerekli." Tapping static text first ends the e-mail edit.
- tapOn: "Ortak harcamalarınızı kolayca takip edin"
- tapOn:
    id: "login-password"
- inputText: ${SMOKE_PASSWORD}
# hideKeyboard is unreliable on iOS with React Native; tapping static text
# outside the fields dismisses the keyboard instead.
- tapOn: "Ortak harcamalarınızı kolayca takip edin"
- tapOn: "Giriş yap"
# Fail here, with the reason, if the form rejected the input instead of
# signing in (otherwise the flow only times out waiting for "Gruplarım").
# The messages come from src/utils/validation.ts and show right after the tap.
- assertNotVisible: "Şifre gerekli."
- assertNotVisible: "Geçerli bir e-posta adresi girin."
# iOS offers to save the password after a successful sign-in.
- extendedWaitUntil:
    visible: "Not Now"
    timeout: 8000
    optional: true
- tapOn:
    text: "Not Now"
    optional: true
- extendedWaitUntil:
    visible: "Gruplarım"
    timeout: 30000
