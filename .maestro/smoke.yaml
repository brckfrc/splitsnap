# Smoke flow: sign in → add an expense → record a payment → balances follow.
# Runs as Deniz against a freshly seeded backend: Test grubu starts at Deniz
# +₺3.000, Mert and Sude −₺1.500. Locally `npm run test:e2e` resets the local
# stack and drives the dev build; the release workflow resets staging and
# passes APP_TARGET=release for the standalone e2e build.
#
# APP_TARGET has no default here on purpose: a flow-level `env` value wins over
# `maestro test -e`, so a `dev` default silently ran the dev-client launch in CI
# too (2026-11-22). On iOS 27 its deep link raises a late "Open in SplitSnap?"
# prompt that covered the login form of the release build.
appId: dev.borak.splitsnap
name: Smoke — expense and payment
---
# Fail at once if APP_TARGET is missing or misspelled; otherwise both launch
# subflows below are skipped and the flow fails later, far from the cause.
- assertTrue: ${APP_TARGET == 'dev' || APP_TARGET == 'release'}
- runFlow:
    when:
      true: ${APP_TARGET == 'dev'}
    file: subflows/launch-dev.yaml
- runFlow:
    when:
      true: ${APP_TARGET == 'release'}
    file: subflows/launch-release.yaml
- runFlow: subflows/login.yaml

- tapOn: "Grup Test grubu"
- extendedWaitUntil:
    visible: "Üyeler"
    timeout: 15000

# ₺300 split equally, paid by Deniz (the defaults): +₺200 for Deniz, −₺100 each.
- tapOn: "Yeni harcama"
- tapOn: "örn. Akşam Yemeği"
- inputText: "Maestro testi"
- tapOn: "0"
- inputText: "300"
- tapOn: "Done"
- scrollUntilVisible:
    element: "Kaydet"
    direction: DOWN
- tapOn: "Kaydet"
- extendedWaitUntil:
    visible: "Harcama Maestro testi"
    timeout: 15000

- tapOn: "Ödeme özetine git"
- extendedWaitUntil:
    visible: "Önerilen Ödemeler"
    timeout: 15000
- assertVisible: "Toplam: ₺4.800"
- assertVisible: "₺3.200"
- assertVisible: "Henüz ödeme kaydı bulunmuyor."
- assertVisible:
    text: "Ödendi"
    index: 1

# Record the first suggested payment (₺1.600 to Deniz).
- tapOn:
    text: "Ödendi"
    index: 0
- extendedWaitUntil:
    visible: "Ödemeyi Onayla"
    timeout: 5000
- tapOn: "Kaydet"

# One debtor left, Deniz's net halves, and the payment shows in the history.
- extendedWaitUntil:
    notVisible: "₺3.200"
    timeout: 15000
- assertNotVisible: "Henüz ödeme kaydı bulunmuyor."
- assertVisible:
    text: "Ödendi"
    index: 0
- assertNotVisible:
    text: "Ödendi"
    index: 1
